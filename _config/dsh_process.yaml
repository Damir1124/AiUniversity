# =====================================================================
#  dsh_process.yaml — Главная конфигурация системы обработки знаний
#  DeepSeek Harness + Obsidian Vault
# =====================================================================

# Версия схемы
schema_version: "1.0"

# Языки, которые нейросеть использует при официальных ответах
languages:
  primary: "Russian"
  secondary: "English"

# ---------------------------------------------------------------------
# Режимы обработки (Modes). Каждый автоматически задаёт свойства (frontmatter)
# и внутренний шаблон заметки.
# ---------------------------------------------------------------------
modes:
  # --- 1. Сухая выжимка ----------------------------------------------
  dry:
    id: "dry"
    label: "Сухая выжимка"
    description: "Факты, формулы, определения, логические цепочки. Без вводных конструкций, лирики и истории вопроса."
    target_dir: "02_Знания"
    template: "_scripts/templates/dry.md"
    properties:
      mode: "dry"
      status: "done"
    filter_rules:
      keep:
        - "fact"
        - "formula"
        - "definition"
        - "algorithm"
        - "logical_chain"
        - "link"
      drop:
        - "аннотация"
        - "вступление"
        - "история вопроса"
        - "лирика"
        - "общие рассуждения"
        - "повтор"

  # --- 2. Экзаменационный режим --------------------------------------
  exam:
    id: "exam"
    label: "Экзаменационный режим"
    description: "Формат «Вопрос — Точный короткий ответ» + шпаргалка."
    target_dir: "03_Экзамены"
    template: "_scripts/templates/exam.md"
    properties:
      mode: "exam"
      status: "done"
    filter_rules:
      question_format: "Q — A"
      include_cheatsheet: true

  # --- 3. Объяснение на пальцах --------------------------------------
  plain:
    id: "plain"
    label: "Объяснение на пальцах"
    description: "Упрощённое изложение сложных концептов без потери точности."
    target_dir: "02_Знания"
    template: "_scripts/templates/plain.md"
    properties:
      mode: "plain"
      status: "done"
    filter_rules:
      simplify: true
      analogies: true
      preserve_precision: true

  # --- 4. Семантическое связывание ------------------------------------
  links:
    id: "links"
    label: "Семантическое связывание"
    description: "Автоматическое выделение терминов для создания сквозных ссылок [[термин]]."
    target_dir: "04_Термины"
    template: "_scripts/templates/links.md"
    properties:
      mode: "links"
      status: "done"
    filter_rules:
      extract_terms: true
      bidirectional_links: true

# ---------------------------------------------------------------------
# Каталоги Vault (полочки)
# ---------------------------------------------------------------------
catalog:
  raw: "raw"              # входящие/сырые исходники (изолированы)
  inbox: "00_Inbox"       # неразобранное
  knowledge: "02_Знания"  # сухая выжимка, объяснения
  exam: "03_Экзамены"     # экзаменационные заметки
  terms: "04_Термины"     # термины и связи
  cheatsheet: "05_Шпаргалки"
  reports: "06_Отчеты"    # отчёты о обработке

# ---------------------------------------------------------------------
# Изоляция: файлы raw не попадают в граф знаний Obsidian.
# Obsidian игнорирует папку raw через .obsidian/app.json exclude.
# ssh-фильтры обрабатывают только raw/*.md -> 02_Знания|03_Экзамены|04_Термины
# ---------------------------------------------------------------------
processing:
  input: "raw"
  output: "02_Знания"
  overwrite: false          # не перезаписывать уже обработанное
  extensions: [".md"]

# ---------------------------------------------------------------------
# Git / GitHub-синхронизация
# ---------------------------------------------------------------------
git:
  enabled: true
  remote: "origin"          # имя remote в .git/config
  default_branch: "main"
  auto_commit_message: "Vault sync: {date}"
  # Пути, исключённые из репозитория (секреты, большие бинарники)
  exclude:
    - ".git"
    - "raw/binaries/**"
    - "*.exe"
    - "*.dll"
    - "*.dat"